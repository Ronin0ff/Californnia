name: Windows Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download Xray + geo assets
        run: python scripts/download_xray.py --platform windows-x86_64

      - name: Build exe
        run: pyinstaller --clean --noconfirm byrds.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: byRDS-VPN-windows-x86_64
          path: dist/byRDS-VPN
